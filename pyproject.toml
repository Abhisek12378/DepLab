[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deplab"
version = "0.1.0"
description = "Empirical Python dependency compatibility—tested, not guessed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DepLab contributors" }]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
app = [
  "openai>=2.0.0",
  "packaging>=24.0",
  "python-dotenv>=1.0.1",
  "streamlit>=1.40.0",
]
api = [
  "fastapi>=0.115.0",
  "openai>=2.0.0",
  "packaging>=24.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.34.0",
]
full = [
  "fastapi>=0.115.0",
  "openai>=2.0.0",
  "packaging>=24.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.1",
  "streamlit>=1.40.0",
  "uvicorn[standard]>=0.34.0",
]

[project.scripts]
deplab = "deplab.cli:main"
deplab-api = "deplab.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/deplab"]
